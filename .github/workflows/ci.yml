name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Ensure PostgreSQL 16+ binaries
        run: |
          if ! ls /usr/lib/postgresql/1[6-9]/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-16
          fi
      - name: Start real PostgreSQL (non-root cluster)
        run: |
          export PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          echo "PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
          scripts/pg-test.sh start
      - name: Ledger invariants, API, webhook, concurrency and crash-recovery tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Stop PostgreSQL
        if: always()
        run: scripts/pg-test.sh stop
